services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: url_shortener
      POSTGRES_PASSWORD: url_shortener_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U url_shortener -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]
    volumes: [url-shortener-postgres:/var/lib/postgresql/data]
  api:
    build:
      context: .
      dockerfile: Dockerfile.development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=url_shortener;Username=url_shortener;Password=url_shortener_dev
      ConnectionStrings__Redis: redis:6379
      ManagementAuth__Tokens__0__Token: ${URL_SHORTENER_TOKEN:?Set URL_SHORTENER_TOKEN before starting Docker Compose}
      ManagementAuth__Tokens__0__OwnerId: ${URL_SHORTENER_OWNER_ID:-local-user-a}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.0
    environment:
      DOTNET_DASHBOARD_OTLP_ENDPOINT_URL: http://+:18889
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports: ["18888:18888"]
volumes:
  url-shortener-postgres:
